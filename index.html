</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><div class="brand-mark">Z</div><div><strong>ZERK</strong><small>训练记录 · 组间计时</small></div></div>
      <div class="header-actions"><button id="backupBtn" class="icon-btn backup-btn" aria-label="数据备份">备份</button><button id="installBtn" class="icon-btn" aria-label="安装应用" title="安装应用">＋</button></div>

    <section class="summary">

        <div id="today" class="date-pill"></div>
      </div>
      <div class="stats">
        <div class="stat"><b id="totalSets">0</b><span>今日已完成组数</span></div>
        <div class="stat"><b id="selectedCount">0</b><span>本次勾选动作</span></div>
      </div>
    </section>

    <div class="section-head"><h2>动作库</h2><p>只统计已勾选动作</p></div>
    <section id="library" class="library"></section>
    <button id="addExercise" class="add-btn">＋ 从常用动作中添加</button>
    <section id="completedSection" class="completed-section" hidden>
      <button id="completedToggle" class="completed-toggle" type="button" aria-expanded="false" aria-controls="completedLibrary"><strong>已完成</strong><span><b id="completedCount">0</b> 个动作</span><i>⌄</i></button>
      <div id="completedLibrary" class="completed-library" hidden></div>
    </section>
    <button id="finishWorkout" class="finish-workout" type="button" disabled>完成全部动作后结束训练</button>
    <button id="undoSet" class="undo" disabled>撤销上一组</button>
  </main>

  <aside id="restBar" class="rest-bar" aria-label="休息计时器">

      <button id="restExpand" class="energy" aria-label="展开休息设置"><span>REST</span></button>
      <div><div id="restTime" class="rest-time">03:00</div><div id="restStatus" class="rest-status">完成一组后自动开始</div></div>
      <button id="restToggle" class="rest-toggle">开始</button>
    </div>

      <div id="durationRow" class="duration-row" aria-label="选择休息时长"></div>
      <div class="rest-controls"><button id="restReset">重置计时</button><button id="restEnd" class="danger">结束休息</button></div>
    </div>
  </aside>

  <dialog id="exerciseDialog">
    <form id="exerciseForm" class="modal" method="dialog">
      <div class="modal-head"><div><h2>添加训练动作</h2><p id="presetHint">选择后自动加入并勾选</p></div><button type="button" id="cancelDialog" class="close-modal" aria-label="关闭">×</button></div>
      <section id="presetList" class="preset-list" aria-label="常用动作备选"></section>
      <details class="manual">
        <summary>没有想要的？手动填写</summary>
        <div class="manual-fields">
          <div class="field"><label for="name">动作名称</label><input id="name" name="name" maxlength="30" placeholder="例如：坐姿划船"></div>
          <div class="field"><label for="part">训练部位</label><input id="part" name="part" maxlength="20" placeholder="例如：背部"></div>
          <div class="field"><label for="equipment">器械</label><input id="equipment" name="equipment" maxlength="30" placeholder="例如：龙门架"></div>
          <div class="field"><label for="target">目标组数</label><select id="target" name="target"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div>
          <div class="modal-actions"><button type="button" id="clearManual">清空</button><button class="save" value="default">保存并勾选</button></div>
        </div>
      </details>
    </form>
  </dialog>
  <dialog id="backupDialog">
    <section class="modal">
      <div class="modal-head"><div><h2>数据备份</h2><p>训练记录保存在当前设备</p></div><button type="button" id="closeBackup" class="close-modal" aria-label="关闭">×</button></div>
      <p class="backup-copy">导出会保存动作、组数、重量、次数和训练历史。更换手机或清理浏览器前，请先导出备份。</p>
      <div class="backup-actions">
        <button id="exportBackup" class="backup-action primary">导出训练备份</button>
        <label class="backup-action" for="importBackup">导入并恢复备份</label>
        <input id="importBackup" type="file" accept="application/json,.json" hidden>
      </div>

    </section>
  </dialog>
  <dialog id="summaryDialog">
    <section class="modal">
      <div class="modal-head"><div><h2>今日训练总结</h2><p id="summarySubtitle"></p></div><button type="button" id="closeSummaryTop" class="close-modal" aria-label="关闭">×</button></div>
      <div id="summaryMetrics" class="summary-metrics"></div>
      <div id="summaryExercises" class="summary-exercises"></div>
      <button id="closeSummary" class="summary-close" type="button">完成并关闭</button>
    </section>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="celebrate" class="celebrate" aria-hidden="true"></div>

  <script>
    const DAYS={back:{label:'背日',title:'背日训练'},chest:{label:'胸日',title:'胸日训练'},legs:{label:'腿日',title:'腿日训练'}};
    const DEFAULTS=[

      {id:'legs-press',day:'legs',name:'腿举',part:'股四头肌',equipment:'腿举机',target:4},
      {id:'legs-bridge',day:'legs',name:'臀桥',part:'臀部',equipment:'臀桥机',target:4},

      back:[

        {id:'low-row',name:'坐姿低位划船',part:'中背部',equipment:'NewTech 划船机',target:4},
        {id:'chest-row',name:'胸托水平划船',part:'中背部',equipment:'NewTech 胸托划船机',target:4},

        {id:'pullover-machine',name:'器械直臂下拉',part:'背阔肌',equipment:'NewTech Pullover',target:3},
        {id:'cable-row',name:'坐姿绳索划船',part:'中背部',equipment:'大龙门架',target:4},
        {id:'face-pull',name:'面拉',part:'后束 / 上背',equipment:'大龙门架',target:3},
        {id:'straight-pulldown',name:'直臂下压',part:'背阔肌',equipment:'大龙门架',target:3},
        {id:'reverse-fly',name:'器械反向飞鸟',part:'三角肌后束',equipment:'NewTech 反向飞鸟机',target:4},
        {id:'rear-delt-row',name:'后束划船',part:'三角肌后束 / 上背',equipment:'NewTech 划船机',target:3},

      ],
      chest:[
        {id:'decline-press',name:'下斜推胸',part:'下胸',equipment:'NewTech',target:4},
        {id:'multi-press',name:'超级推胸',part:'胸部',equipment:'NewTech Multi Press',target:4},
        {id:'flat-machine',name:'水平器械推胸',part:'胸部中部',equipment:'NewTech 推胸机',target:4},
        {id:'incline-machine',name:'上斜器械推胸',part:'上胸',equipment:'NewTech 上斜推胸机',target:4},
        {id:'pec-deck',name:'器械夹胸',part:'胸部内侧',equipment:'NewTech 蝴蝶机',target:3},
        {id:'bench-press',name:'杠铃卧推',part:'胸部',equipment:'卧推架 + 奥杆',target:4},
        {id:'incline-dumbbell',name:'上斜哑铃卧推',part:'上胸',equipment:'哑铃 + 可调凳',target:4},
        {id:'low-cable-fly',name:'低位绳索夹胸',part:'上胸',equipment:'大龙门架',target:3},
        {id:'assist-dip',name:'辅助双杠臂屈伸',part:'下胸 / 三头',equipment:'NewTech 辅助器',target:3},
        {id:'lateral-machine',name:'器械侧平举',part:'三角肌中束',equipment:'NewTech 侧平举机',target:4},
        {id:'cable-lateral',name:'单臂绳索侧平举',part:'三角肌中束',equipment:'大龙门架',target:4},
        {id:'dumbbell-lateral',name:'哑铃侧平举',part:'三角肌中束',equipment:'哑铃',target:4}
      ],
      legs:[
        {id:'barbell-squat',name:'杠铃深蹲',part:'腿部',equipment:'Tiger Force / Samtek 深蹲架',target:4},
        {id:'hack-squat',name:'哈克深蹲',part:'股四头肌 / 臀部',equipment:'NewTech 哈克深蹲机',target:4},
        {id:'pendulum-squat',name:'钟摆深蹲',part:'股四头肌 / 臀部',equipment:'NewTech 钟摆深蹲机',target:4},
        {id:'leg-press-45',name:'45° 倒蹬',part:'股四头肌 / 臀部',equipment:'NewTech 腿举机',target:4},
        {id:'single-leg-press',name:'单腿腿举',part:'股四头肌 / 臀部',equipment:'NewTech 腿举机',target:3},
        {id:'leg-extension-machine',name:'器械腿屈伸',part:'股四头肌',equipment:'NewTech 腿屈伸机',target:4},
        {id:'seated-leg-curl',name:'坐姿腿弯举',part:'腿后侧',equipment:'NewTech 腿弯举机',target:4},
        {id:'lying-leg-curl',name:'俯卧腿弯举',part:'腿后侧',equipment:'NewTech 俯卧腿弯举机',target:3},
        {id:'glute-drive',name:'器械臀推',part:'臀部',equipment:'NewTech 臀推机',target:4},
        {id:'hip-abduction',name:'髋外展',part:'臀中肌',equipment:'NewTech 外展机',target:4},
        {id:'hip-adduction',name:'髋内收',part:'大腿内侧',equipment:'NewTech 内收机',target:3},
        {id:'calf-raise',name:'器械提踵',part:'小腿',equipment:'NewTech 提踵机',target:4},
        {id:'romanian-deadlift',name:'罗马尼亚硬拉',part:'腿后侧 / 臀部',equipment:'奥杆 + 硬拉平台',target:4},
        {id:'bulgarian-squat',name:'保加利亚分腿蹲',part:'腿部 / 臀部',equipment:'哑铃 + 可调凳',target:3},
        {id:'cable-kickback',name:'绳索后踢腿',part:'臀部',equipment:'大龙门架',target:3},
        {id:'goblet-squat',name:'高脚杯深蹲',part:'腿部',equipment:'哑铃',target:3},
        {id:'walking-lunge',name:'哑铃行走箭步蹲',part:'腿部 / 臀部',equipment:'哑铃',target:3}
      ]
    };
    const STORAGE='zerk-training-state-v3',RECOVERY_STORAGE='zerk-training-recovery-v7';
    const oldDuration=Number(localStorage.getItem('zerk-duration'));
    const fresh={version:7,day:'back',duration:[30,60,90,120,150,180].includes(oldDuration)?oldDuration:180,custom:[],hidden:[],selected:{back:[],chest:[],legs:[]},targets:{},lastInputs:{},records:{},history:[],setProfiles:{},drafts:{}};
    let state=loadState();
    let timer={total:state.duration,remaining:state.duration,running:false,endAt:0,raf:0};
    let installPrompt=null,toastTimer=0,completedOpen=false,expandedIds=new Set();
    const $=s=>document.querySelector(s);
    function loadState(){for(const key of [STORAGE,RECOVERY_STORAGE]){try{const parsed=JSON.parse(localStorage.getItem(key));if(!parsed)continue;const merged={...fresh,...parsed,version:7,selected:{...fresh.selected,...parsed.selected},targets:parsed.targets||{},lastInputs:parsed.lastInputs||{},records:parsed.records||{},history:parsed.history||[],custom:parsed.custom||[],hidden:parsed.hidden||[],setProfiles:parsed.setProfiles||{},drafts:parsed.drafts||{}};if(Number(parsed.version)<4)merged.selected={back:[],chest:[],legs:[]};return merged}catch{}}return JSON.parse(JSON.stringify(fresh))}
    function save(){try{state.version=7;const data=JSON.stringify(state);localStorage.setItem(STORAGE,data);localStorage.setItem(RECOVERY_STORAGE,data);localStorage.setItem('zerk-duration',String(state.duration));return true}catch{setTimeout(()=>showToast('本机保存失败，请立即导出备份'),0);return false}}
    function dateKey(){const d=new Date(),off=d.getTimezoneOffset();return new Date(d.getTime()-off*60000).toISOString().slice(0,10)}
    function allExercises(){return [...DEFAULTS,...state.custom]}
    function dayExercises(){return allExercises().filter(x=>x.day===state.day&&!state.hidden.includes(x.id))}
    function completed(id){return state.records[dateKey()]?.[state.day]?.[id]||0}
    function selectedIds(){return state.selected[state.day]||[]}
    function todaySets(id){return state.history.filter(item=>item.date===dateKey()&&item.day===state.day&&item.id===id&&item.active!==false).sort((a,b)=>(a.at||0)-(b.at||0))}
    function lastSet(id){return [...state.history].reverse().find(item=>item.id===id&&item.active!==false&&(Number.isFinite(Number(item.reps))||Array.isArray(item.segments)))}
    function targetFor(ex){return Number(state.targets?.[ex.id]||ex.target||3)}
    function profileFor(id){return {...{type:'normal',multiplier:1},...(state.setProfiles[id]||{})}}
    function totalReps(item){return Array.isArray(item.segments)?item.segments.reduce((sum,s)=>sum+(Number(s.reps)||0),0):Number(item.reps)||0}
    function setVolume(item){const multiplier=Number(item.multiplier)||1;return Array.isArray(item.segments)?item.segments.reduce((sum,s)=>sum+(Number(s.weight)||0)*(Number(s.reps)||0),0)*multiplier:(Number(item.weight)||0)*(Number(item.reps)||0)*multiplier}
    function setDescription(item){if(Array.isArray(item.segments))return `${item.segments.map(s=>`${Number(s.weight)||0}kg×${Number(s.reps)||0}`).join(' → ')} · ${totalReps(item)}次 · 容量${Math.round(setVolume(item))}`;return `${Number(item.weight)||0} kg × ${Number(item.reps)||0} 次`}
    function groupOptions(selected){return Array.from({length:10},(_,i)=>i+1).map(n=>`<option value="${n}" ${n===Number(selected)?'selected':''}>${n}</option>`).join('')}
    function todayTotal(){return selectedIds().reduce((sum,id)=>sum+completed(id),0)}
    function escapeHtml(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}
    function draftFor(id,profile){const saved=state.drafts[id],last=lastSet(id),legacy=state.lastInputs[id]||{};if(profile.type==='drop'){const segments=saved?.segments||last?.segments||legacy.segments||[{weight:'',reps:8},{weight:'',reps:10},{weight:'',reps:12}];return {segments:segments.map(s=>({weight:s.weight??'',reps:s.reps??''}))}}return {weight:saved?.weight??legacy.weight??(!last?.segments?last?.weight:''),reps:saved?.reps??legacy.reps??(!last?.segments?last?.reps:10)??10}}
    function renderSetRows(ex,profile){const sets=todaySets(ex.id),done=completed(ex.id),target=targetFor(ex),draft=draftFor(ex.id,profile),rows=[];sets.forEach((item,index)=>{const historyIndex=state.history.indexOf(item);rows.push(`<div class="set-line done"><div class="set-line-main"><input class="set-check" type="checkbox" checked data-uncomplete="${historyIndex}" aria-label="取消第${index+1}组完成"><div class="set-label"><strong>第 ${index+1} 组</strong><span>${escapeHtml(setDescription(item))}</span></div></div></div>`)});for(let index=sets.length;index<done;index++)rows.push(`<div class="set-line done"><div class="set-line-main"><input class="set-check" type="checkbox" checked disabled aria-label="第${index+1}组旧版记录"><div class="set-label"><strong>第 ${index+1} 组</strong><span>旧版完成记录</span></div></div></div>`);if(done<target){const group=done+1,pending=profile.type==='drop'?`<div class="drop-fields">${draft.segments.map((s,index)=>`<div class="drop-segment"><b>${index+1}</b><label class="compact-field"><input data-drop-weight data-segment="${index}" type="number" inputmode="decimal" min="0" step="0.5" value="${s.weight}" placeholder="重量"><span>kg</span></label><label class="compact-field"><input data-drop-reps data-segment="${index}" type="number" inputmode="numeric" min="1" step="1" value="${s.reps}" placeholder="次数"><span>次</span></label></div>`).join('')}</div><div class="set-volume">三段合计，单边重量按双侧容量计算</div>`:`<div class="normal-fields"><label class="compact-field"><input data-normal-weight type="number" inputmode="decimal" min="0" step="0.5" value="${draft.weight}" placeholder="重量"><span>kg</span></label><label class="compact-field"><input data-normal-reps type="number" inputmode="numeric" min="1" step="1" value="${draft.reps}" placeholder="次数"><span>次</span></label></div>`;rows.push(`<div class="set-line current"><div class="set-line-main"><input class="set-check" type="checkbox" data-complete-check="${ex.id}" aria-label="勾选完成第${group}组"><div class="set-label"><strong>第 ${group} 组</strong><span>${profile.type==='drop'?'递减组':'待完成'}</span></div></div><div class="pending-fields">${pending}<button type="button" class="complete-current" data-complete="${ex.id}">勾选完成并开始休息</button></div></div>`);for(let index=done+1;index<target;index++)rows.push(`<div class="set-line locked"><div class="set-line-main"><input class="set-check" type="checkbox" disabled aria-label="第${index+1}组等待完成"><div class="set-label"><strong>第 ${index+1} 组</strong><span>等待上一组</span></div></div></div>`)}else rows.push(`<button type="button" class="complete-current" data-add-extra="${ex.id}">＋ 追加一组</button>`);return `<div class="set-list">${rows.join('')}</div>`}
    function renderExerciseCard(ex,index){const chosen=selectedIds().includes(ex.id),done=completed(ex.id),target=targetFor(ex),finished=chosen&&done>=target,expanded=expandedIds.has(ex.id),profile=profileFor(ex.id),status=finished?'目标完成':chosen?`${done}/${target} 组`:'未选择';return `<article class="exercise ${chosen?'selected':''} ${finished?'finished':''}" data-exercise="${ex.id}"><div class="exercise-head"><div class="select-stack"><input class="check" type="checkbox" data-select="${ex.id}" aria-label="选择${escapeHtml(ex.name)}" ${chosen?'checked':''}><span class="exercise-index">${String(index+1).padStart(2,'0')}</span></div><button type="button" class="exercise-toggle" data-expand="${ex.id}" aria-expanded="${expanded}" aria-controls="exercise-body-${ex.id}"><span class="exercise-toggle-row"><span><span class="exercise-name">${escapeHtml(ex.name)}</span><span class="status-chip">${status}</span></span><span class="exercise-chevron">⌄</span></span><span class="meta">${escapeHtml(ex.part)} · ${escapeHtml(ex.equipment)}</span></button><button type="button" class="delete" data-delete="${ex.id}" aria-label="将${escapeHtml(ex.name)}移出动作库">×</button></div><div id="exercise-body-${ex.id}" class="exercise-body" ${expanded?'':'hidden'}><div class="exercise-tools"><label class="target-control">目标 <select data-target="${ex.id}" aria-label="${escapeHtml(ex.name)}目标组数">${groupOptions(target)}</select> 组</label>${chosen?`<div class="set-type" aria-label="组记录方式"><button type="button" data-set-type="normal" class="${profile.type==='normal'?'active':''}">普通组</button><button type="button" data-set-type="drop" class="${profile.type==='drop'?'active':''}">递减组</button></div>`:''}</div>${chosen&&profile.type==='drop'?`<label class="side-toggle"><input type="checkbox" data-bilateral ${profile.multiplier===2?'checked':''}> 单边重量，容量按左右两侧 ×2</label>`:''}${chosen?renderSetRows(ex,profile):`<div class="saved-note"><b>已保存在本机</b> · 勾选动作后开始逐组记录</div>`}</div></article>`}
    function render(){
      $('#dayTabs').innerHTML=Object.entries(DAYS).map(([id,d])=>`<button class="day-tab" data-day="${id}" aria-selected="${id===state.day}">${d.label}</button>`).join('');
      $('#dayTitle').textContent=DAYS[state.day].title;$('#today').textContent=new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',weekday:'short'}).format(new Date());
      $('#totalSets').textContent=todayTotal();$('#selectedCount').textContent=selectedIds().length;
      const list=dayExercises();
      $('#library').innerHTML=list.length?list.map(renderExerciseCard).join(''):`<div class="empty">当前动作库是空的，可随时从常用动作中添加。</div>`;
      const completedLibrary=$('#completedLibrary'),finishedCards=[...$('#library').querySelectorAll('.exercise.finished')];completedLibrary.replaceChildren(...finishedCards);$('#completedSection').hidden=!finishedCards.length;$('#completedCount').textContent=finishedCards.length;$('#completedToggle').setAttribute('aria-expanded',String(completedOpen));completedLibrary.hidden=!completedOpen;if(finishedCards.length&& !$('#library').querySelector('.exercise'))$('#library').innerHTML='<div class="all-done-hint">本次勾选动作已全部完成</div>';
      const selected=selectedIds(),remaining=selected.filter(id=>{const ex=allExercises().find(item=>item.id===id);return ex&&completed(id)<targetFor(ex)}),finishButton=$('#finishWorkout');finishButton.disabled=!selected.length||remaining.length>0;finishButton.textContent=!selected.length?'请先勾选训练动作':remaining.length?`还有 ${remaining.length} 个动作未完成`:'结束训练并查看总结';
      const undo=state.history.findLast?.(h=>h.date===dateKey()&&h.day===state.day&&h.active!==false)||[...state.history].reverse().find(h=>h.date===dateKey()&&h.day===state.day&&h.active!==false);$('#undoSet').disabled=!undo;
      renderTimer();
    }
    function addCandidates(){const hiddenCustom=state.custom.filter(x=>x.day===state.day&&!x.preset&&state.hidden.includes(x.id)).map(x=>({...x,actualId:x.id,savedCustom:true}));return [...DEFAULTS.filter(x=>x.day===state.day).map(x=>({...x,actualId:x.id,builtin:true})),...PRESETS[state.day].map(x=>({...x,actualId:`preset-${x.id}`,builtin:false})),...hiddenCustom]}
    function renderPresets(){const existing=new Set(dayExercises().map(x=>x.id));$('#presetHint').textContent=`${DAYS[state.day].label}常用动作 · 选择组数后加入`;$('#presetList').innerHTML=addCandidates().map(p=>{const added=existing.has(p.actualId),target=targetFor({...p,id:p.actualId});return `<article class="preset ${added?'added':''}" data-preset-card="${p.actualId}"><div><strong>${escapeHtml(p.name)}</strong><small>${escapeHtml(p.part)} · ${escapeHtml(p.equipment)}</small></div><div class="preset-actions"><label>目标 <select data-preset-target aria-label="${escapeHtml(p.name)}目标组数" ${added?'disabled':''}>${groupOptions(target)}</select> 组</label><button type="button" class="preset-add" data-preset="${p.actualId}" ${added?'disabled':''}>${added?'已添加':'加入'}</button></div></article>`}).join('')}
    function addPreset(actualId,groups){let item=allExercises().find(x=>x.id===actualId),id=actualId;if(item){state.hidden=state.hidden.filter(x=>x!==id)}else{const presetId=actualId.replace(/^preset-/,''),p=PRESETS[state.day].find(x=>x.id===presetId);if(!p)return;item=p;id=`preset-${p.id}`;if(!allExercises().some(x=>x.id===id))state.custom.push({...p,id,day:state.day,custom:true,preset:true})}state.targets[id]=Number(groups)||item.target;state.selected[state.day]=[...new Set([...selectedIds(),id])];expandedIds.add(id);save();dialog.close();render();showToast(`${item.name}已添加并保存在本机`) }
    function ensureRecord(){state.records[dateKey()]??={};state.records[dateKey()][state.day]??={};return state.records[dateKey()][state.day]}
    function completeCurrent(id,card){const profile=profileFor(id),entry={date:dateKey(),day:state.day,id,at:Date.now(),active:true,multiplier:profile.type==='drop'?profile.multiplier:1};if(profile.type==='drop'){const weights=[...card.querySelectorAll('[data-drop-weight]')].map(input=>Number(input.value)),reps=[...card.querySelectorAll('[data-drop-reps]')].map(input=>Number(input.value));if(weights.some(value=>!Number.isFinite(value)||value<0)||reps.some(value=>!Number.isFinite(value)||value<1)){showToast('请填写三段正确的重量和次数');return false}entry.segments=weights.map((weight,index)=>({weight,reps:reps[index]}));entry.reps=reps.reduce((sum,value)=>sum+value,0);entry.volume=setVolume(entry);state.drafts[id]={segments:entry.segments.map(segment=>({...segment}))};state.lastInputs[id]={segments:entry.segments.map(segment=>({...segment})),multiplier:entry.multiplier,type:'drop'}}else{const weight=Number(card.querySelector('[data-normal-weight]')?.value),reps=Number(card.querySelector('[data-normal-reps]')?.value);if(!Number.isFinite(weight)||weight<0||!Number.isFinite(reps)||reps<1){showToast('请填写正确的重量和次数');return false}entry.weight=weight;entry.reps=reps;entry.volume=setVolume(entry);state.drafts[id]={weight,reps};state.lastInputs[id]={weight,reps}}const rec=ensureRecord();rec[id]=(rec[id]||0)+1;state.history.push(entry);expandedIds.add(id);save();startRest(true);render();if(isDayComplete())celebrate();else showToast(`第 ${completed(id)} 组已完成`);return true}
    function undoSpecific(index){const item=state.history[Number(index)];if(!item||item.active===false||item.date!==dateKey()||item.day!==state.day)return;const rec=ensureRecord();rec[item.id]=Math.max(0,(rec[item.id]||0)-1);item.active=false;expandedIds.add(item.id);save();render();showToast('这一组已取消完成')}
    function undoSet(){const index=state.history.findLastIndex?.(h=>h.date===dateKey()&&h.day===state.day&&h.active!==false)??-1;if(index>=0)return undoSpecific(index);for(let i=state.history.length-1;i>=0;i--)if(state.history[i].date===dateKey()&&state.history[i].day===state.day&&state.history[i].active!==false)return undoSpecific(i)}
    function isDayComplete(){const ids=selectedIds();return ids.length>0&&ids.every(id=>{const ex=allExercises().find(x=>x.id===id);return ex&&completed(id)>=targetFor(ex)})}
    function celebrate(){const box=$('#celebrate');box.innerHTML='<div class="completion-signal"><b>✓</b><span>训练完成</span></div>';showToast('训练完成，今天很强！');setTimeout(()=>box.innerHTML='',1800)}
    function showToast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),1800)}
    function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
    function renderTimer(){const bar=$('#restBar'),progress=timer.total?Math.max(0,Math.min(100,(timer.total-timer.remaining)/timer.total*100)):0;bar.classList.toggle('running',timer.running);bar.style.setProperty('--rest-progress',`${progress}%`);$('#restTime').textContent=fmt(Math.max(0,timer.remaining));$('#restToggle').textContent=timer.running?'暂停':timer.remaining===0?'再来一次':'开始';$('#durationRow').innerHTML=[30,60,90,120,150,180].map(d=>`<button class="duration ${d===state.duration?'selected':''}" data-duration="${d}">${fmt(d)}</button>`).join('')}
    function startRest(auto=false){cancelAnimationFrame(timer.raf);timer.total=state.duration;timer.remaining=state.duration;timer.running=true;timer.endAt=Date.now()+timer.remaining*1000;$('#restStatus').textContent=auto?'组间休息中':'计时中';tick()}
    function toggleRest(){if(timer.running){timer.running=false;timer.remaining=Math.max(0,Math.ceil((timer.endAt-Date.now())/1000));cancelAnimationFrame(timer.raf);$('#restStatus').textContent='已暂停';renderTimer()}else{if(timer.remaining===0)timer.remaining=state.duration;timer.running=true;timer.endAt=Date.now()+timer.remaining*1000;$('#restStatus').textContent='计时中';tick()}}
    function tick(){if(!timer.running)return;timer.remaining=Math.ceil((timer.endAt-Date.now())/1000);if(timer.remaining<=0){timer.remaining=0;timer.running=false;$('#restStatus').textContent='休息结束 · 继续训练';beep();renderTimer();return}renderTimer();timer.raf=requestAnimationFrame(tick)}
    function resetRest(){timer.running=false;cancelAnimationFrame(timer.raf);timer.total=state.duration;timer.remaining=state.duration;$('#restStatus').textContent='计时已重置';renderTimer()}
    function endRest(){timer.running=false;cancelAnimationFrame(timer.raf);timer.remaining=0;$('#restStatus').textContent='休息已结束';renderTimer()}
    function beep(){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.55);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.55)}catch{}}
    function showWorkoutSummary(){const ids=selectedIds(),items=allExercises().filter(ex=>ids.includes(ex.id)),sets=state.history.filter(item=>item.date===dateKey()&&item.day===state.day&&item.active!==false&&ids.includes(item.id)),volume=sets.reduce((sum,item)=>sum+setVolume(item),0);$('#summarySubtitle').textContent=`${new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric'}).format(new Date())} · ${DAYS[state.day].label}`;$('#summaryMetrics').innerHTML=`<div class="summary-metric"><b>${sets.length}</b><span>完成组数</span></div><div class="summary-metric"><b>${Math.round(volume).toLocaleString()}</b><span>训练容量 kg</span></div>`;$('#summaryExercises').innerHTML=items.map(ex=>{const exerciseSets=sets.filter(item=>item.id===ex.id),details=exerciseSets.map((item,index)=>`${index+1}. ${setDescription(item)}`).join('<br>');return `<article class="summary-exercise"><div class="summary-exercise-head"><strong>${escapeHtml(ex.name)}</strong><span>${exerciseSets.length} 组</span></div><div class="summary-sets">${details||'没有组记录'}</div></article>`}).join('');endRest();$('#summaryDialog').showModal()}
    $('#dayTabs').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(!b)return;state.day=b.dataset.day;completedOpen=false;expandedIds.clear();save();render()});
    function handleLibraryChange(e){const card=e.target.closest('[data-exercise]'),id=card?.dataset.exercise;if(e.target.matches('[data-select]')){const ids=selectedIds();state.selected[state.day]=e.target.checked?[...new Set([...ids,id])]:ids.filter(x=>x!==id);if(e.target.checked)expandedIds.add(id);save();render();return}if(e.target.matches('[data-target]')){state.targets[id]=Number(e.target.value);save();render();return}if(e.target.matches('[data-bilateral]')){state.setProfiles[id]={...profileFor(id),multiplier:e.target.checked?2:1};save();render();return}if(e.target.matches('[data-complete-check]')&&e.target.checked){if(!completeCurrent(id,card))e.target.checked=false;return}if(e.target.matches('[data-uncomplete]')&&!e.target.checked)undoSpecific(e.target.dataset.uncomplete)}
    function handleLibraryInput(e){const card=e.target.closest('[data-exercise]'),id=card?.dataset.exercise;if(!id)return;if(e.target.matches('[data-normal-weight],[data-normal-reps]')){const current=state.drafts[id]||{};state.drafts[id]={weight:e.target.matches('[data-normal-weight]')?e.target.value:current.weight,reps:e.target.matches('[data-normal-reps]')?e.target.value:current.reps};save();return}if(e.target.matches('[data-drop-weight],[data-drop-reps]')){const profile=profileFor(id),draft=draftFor(id,profile),index=Number(e.target.dataset.segment);draft.segments[index][e.target.matches('[data-drop-weight]')?'weight':'reps']=e.target.value;state.drafts[id]=draft;save()}}
    function handleLibraryClick(e){const card=e.target.closest('[data-exercise]'),id=card?.dataset.exercise,expand=e.target.closest('[data-expand]');if(expand){expandedIds.has(id)?expandedIds.delete(id):expandedIds.add(id);render();return}const type=e.target.closest('[data-set-type]');if(type){const next=type.dataset.setType;state.setProfiles[id]={type:next,multiplier:next==='drop'?2:1};state.drafts[id]={};save();expandedIds.add(id);render();return}const complete=e.target.closest('[data-complete]');if(complete)return completeCurrent(id,card);const extra=e.target.closest('[data-add-extra]');if(extra){const ex=allExercises().find(item=>item.id===id),next=targetFor(ex)+1;if(next>10){showToast('最多设置 10 组');return}state.targets[id]=next;save();expandedIds.add(id);render();return}const del=e.target.closest('[data-delete]');if(del&&confirm('把这个动作移出动作库？动作资料和历史记录都会保留，以后可以重新加入。')){state.hidden=[...new Set([...state.hidden,id])];state.selected[state.day]=selectedIds().filter(x=>x!==id);expandedIds.delete(id);save();render();showToast('已移出，动作资料仍已保存')}}
    for(const container of [$('#library'),$('#completedLibrary')]){container.addEventListener('change',handleLibraryChange);container.addEventListener('input',handleLibraryInput);container.addEventListener('click',handleLibraryClick)}
    $('#completedToggle').addEventListener('click',()=>{completedOpen=!completedOpen;$('#completedToggle').setAttribute('aria-expanded',String(completedOpen));$('#completedLibrary').hidden=!completedOpen});$('#finishWorkout').addEventListener('click',showWorkoutSummary);$('#closeSummary').addEventListener('click',()=>$('#summaryDialog').close());$('#closeSummaryTop').addEventListener('click',()=>$('#summaryDialog').close());
    $('#undoSet').addEventListener('click',undoSet);$('#restToggle').addEventListener('click',toggleRest);$('#restReset').addEventListener('click',resetRest);$('#restEnd').addEventListener('click',endRest);$('#restExpand').addEventListener('click',()=>$('#restBar').classList.toggle('open'));
    $('#durationRow').addEventListener('click',e=>{const b=e.target.closest('[data-duration]');if(!b)return;state.duration=Number(b.dataset.duration);save();resetRest()});
    const dialog=$('#exerciseDialog');$('#addExercise').addEventListener('click',()=>{renderPresets();dialog.showModal()});$('#cancelDialog').addEventListener('click',()=>dialog.close());$('#clearManual').addEventListener('click',()=>$('#exerciseForm').reset());$('#presetList').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(!b)return;const card=b.closest('[data-preset-card]'),groups=card.querySelector('[data-preset-target]').value;addPreset(b.dataset.preset,groups)});$('#exerciseForm').addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.currentTarget),name=String(data.get('name')).trim(),part=String(data.get('part')).trim(),equipment=String(data.get('equipment')).trim();if(!name||!part||!equipment){showToast('请把三个项目填写完整');return}const id=`custom-${crypto.randomUUID?.()||Date.now()}`,target=Number(data.get('target'));state.custom.push({id,day:state.day,name,part,equipment,target,custom:true});state.targets[id]=target;state.selected[state.day]=[...selectedIds(),id];expandedIds.add(id);if(!save())return;e.currentTarget.reset();dialog.close();render();showToast('自定义动作已保存并勾选')});
    const backupDialog=$('#backupDialog');
    $('#backupBtn').addEventListener('click',()=>backupDialog.showModal());
    $('#closeBackup').addEventListener('click',()=>backupDialog.close());
    $('#exportBackup').addEventListener('click',()=>{const payload={app:'Zerk 健身训练',schema:7,exportedAt:new Date().toISOString(),data:state},blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`zerk-training-backup-${dateKey()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('训练备份已导出')});
    $('#importBackup').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const payload=JSON.parse(await file.text()),data=payload.data||payload;if(!data||typeof data!=='object'||!data.selected||!data.records||!Array.isArray(data.history))throw new Error('invalid');if(!confirm('恢复会用备份内容替换当前训练数据，继续吗？')){e.target.value='';return}localStorage.setItem(STORAGE,JSON.stringify(data));location.reload()}catch{showToast('这个备份文件无法识别');e.target.value=''}});
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installBtn').hidden=false});
    $('#installBtn').addEventListener('click',async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else{showToast('浏览器菜单中选择“添加到主屏幕”')}});
    document.addEventListener('visibilitychange',()=>{if(timer.running)tick()});
    save();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
  </script>
